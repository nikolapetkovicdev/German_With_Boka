services:
  postgres:
    image: postgres:16-alpine
    container_name: german-with-boka-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: boka
      POSTGRES_PASSWORD: boka
      POSTGRES_DB: german_with_boka
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U boka -d german_with_boka"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
